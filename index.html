<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Thumbi Machan</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
    background: linear-gradient(120deg, #ff6b81, #7b5cff, #00c6d7);
    color: white;
}

/* ---------- OPENING PAGE ---------- */

#opening {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    position: relative;
    overflow: hidden;
}

.open-box {
    position: relative;
    z-index: 10;
}

.open-box h1 {
    font-size: 55px;
    margin-bottom: 30px;
    text-shadow: 0 0 15px white;
    animation: glow 2s infinite alternate;
}

.open-button {
    border: none;
    padding: 18px 40px;
    border-radius: 40px;
    background: white;
    color: #6757e8;
    font-size: 20px;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 5px 25px rgba(0,0,0,0.2);
}

.open-button:hover {
    transform: scale(1.08);
}

/* ---------- BIRTHDAY PAGE ---------- */

#birthday {
    display: none;
    min-height: 100vh;
    text-align: center;
    padding: 70px 20px 80px;
    position: relative;
    overflow: hidden;
}

.birthday-title {
    font-size: 55px;
    font-weight: bold;
    line-height: 1.2;
    text-shadow: 0 0 20px white;
    animation: titleAppear 1.5s ease;
}

.subtitle {
    font-size: 25px;
    margin: 25px 0 35px;
}

/* ---------- PHOTOS ---------- */

.gallery {
    max-width: 950px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
    position: relative;
    z-index: 5;
}

.photo {
    background: rgba(255,255,255,0.18);
    padding: 12px;
    border-radius: 22px;
    backdrop-filter: blur(5px);
    transition: 0.4s;
    animation: photoAppear 1s ease;
}

.photo:hover {
    transform: scale(1.05) rotate(1deg);
}

.photo img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 15px;
}

/* ---------- FALLING EMOJIS ---------- */

.falling {
    position: fixed;
    top: -80px;
    pointer-events: none;
    z-index: 20;
    animation: fall linear forwards;
    will-change: transform, opacity;
}

@keyframes fall {
    0% {
        transform: translateY(-80px) rotate(0deg);
        opacity: 1;
    }

    100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0.9;
    }
}

@keyframes glow {
    from {
        text-shadow: 0 0 10px white;
    }

    to {
        text-shadow: 0 0 30px white;
    }
}

@keyframes titleAppear {
    from {
        opacity: 0;
        transform: scale(0.5);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes photoAppear {
    from {
        opacity: 0;
        transform: translateY(40px) scale(0.8);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* Respect users who prefer reduced motion */
@media (prefers-reduced-motion: reduce) {
    .falling { display: none !important; }
    .open-box h1, .birthday-title, .photo { animation: none !important; }
}

/* ---------- MOBILE ---------- */

@media (max-width: 700px) {

    .open-box h1 {
        font-size: 35px;
    }

    .birthday-title {
        font-size: 35px;
    }

    .subtitle {
        font-size: 19px;
    }

    .gallery {
        grid-template-columns: 1fr;
    }

    .photo img {
        height: 260px;
    }
}
</style>
</head>

<body>

<!-- OPENING SCREEN -->

<section id="opening">

    <div class="open-box">

        <h1>Welcome, Thumbi! 🥳</h1>

        <button class="open-button" id="openButton" onclick="openBirthday()" aria-label="Open birthday page">
            Open chey Thumbi Kuttaaa ❤️
        </button>

    </div>

</section>


<!-- BIRTHDAY SCREEN -->

<section id="birthday">

    <h1 class="birthday-title">
        🎉 HAPPY BIRTHDAY 🎉<br>
        THUMBIIII MACHANEEEEEEEE 🥳
    </h1>

    <div class="subtitle">
        ❤️ Wishing you happiness, success and unlimited smiles ❤️
    </div>


    <!-- FIVE PHOTOS -->

    <div class="gallery" aria-live="polite">

        <div class="photo">
            <img src="screenshot1.png" alt="Screenshot: Thumbi and friends smiling" loading="lazy" onerror="this.style.opacity=0.3; this.alt='Image not found';">
        </div>

        <div class="photo">
            <img src="screenshot2.png" alt="Screenshot: Thumbi birthday memory" loading="lazy" onerror="this.style.opacity=0.3; this.alt='Image not found';">
        </div>

        <div class="photo">
            <img src="screenshot3.png" alt="Screenshot: group photo memory" loading="lazy" onerror="this.style.opacity=0.3; this.alt='Image not found';">
        </div>

        <div class="photo">
            <img src="screenshot4.png" alt="Screenshot: cake and celebration" loading="lazy" onerror="this.style.opacity=0.3; this.alt='Image not found';">
        </div>

        <div class="photo">
            <img src="screenshot5.png" alt="Screenshot: another happy memory" loading="lazy" onerror="this.style.opacity=0.3; this.alt='Image not found';">
        </div>

    </div>

    <!-- SONG (moved inside birthday section so it won't preload before open) -->
    <div style="margin-top: 24px; display: flex; justify-content: center; gap: 12px; align-items: center;">
      <audio id="birthdaySong" loop preload="none" aria-label="Birthday song">
          <source src="song.mp3" type="audio/mpeg">
          Your browser does not support the audio element.
      </audio>

      <button id="audioToggle" aria-pressed="false" aria-controls="birthdaySong">Play Music</button>
    </div>

</section>


<script>
// Small, focused improvements to make the page robust and accessible.

const openButton = document.getElementById('openButton');
const audioToggle = document.getElementById('audioToggle');
const song = document.getElementById('birthdaySong');

// Respect prefers-reduced-motion
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// FALLING animation using requestAnimationFrame for efficiency and proper cleanup
let fallingRunning = false;
let lastSpawn = 0;
const spawnInterval = 180; // ms between spawns
const maxRunMs = 20000; // total spawn duration
let spawnStopTimeout = null;

function openBirthday() {

    // Disable the open button immediately to avoid duplicate clicks
    openButton.disabled = true;

    // Hide opening page
    document.getElementById("opening").style.display = "none";

    // Show birthday page
    document.getElementById("birthday").style.display = "block";

    // Try to start song (click is a user gesture in most browsers)
    if (song) {
        song.play().then(() => {
            // update toggle state
            audioToggle.textContent = 'Pause Music';
            audioToggle.setAttribute('aria-pressed', 'true');
        }).catch((err) => {
            // Autoplay blocked — leave controls to the user
            audioToggle.textContent = 'Play Music';
            audioToggle.setAttribute('aria-pressed', 'false');
            console.log('Audio could not autoplay:', err);
        });
    }

    // Start falling visuals unless reduced-motion is requested
    if (!prefersReducedMotion) startFalling();
}

// Audio toggle button behavior
if (audioToggle) {
    audioToggle.addEventListener('click', function() {
        if (!song) return;
        if (song.paused) {
            song.play().then(() => {
                audioToggle.textContent = 'Pause Music';
                audioToggle.setAttribute('aria-pressed', 'true');
            }).catch((e) => {
                console.log('Play failed:', e);
            });
        } else {
            song.pause();
            audioToggle.textContent = 'Play Music';
            audioToggle.setAttribute('aria-pressed', 'false');
        }
    });
}

// Create one falling item and remove it on animationend to avoid lingering DOM nodes
function spawnItem() {
    const things = [
        "🎉",
        "🎊",
        "🎂",
        "🎈",
        "🎁",
        "🥳",
        "❤️",
        "✨",
        "🍰",
        "💖",
        "⭐",
        "18",
        "18",
        "18"
    ];

    const item = document.createElement('div');
    item.className = 'falling';
    item.textContent = things[Math.floor(Math.random() * things.length)];

    // Randomize horizontal placement but clamp within viewport
    const left = Math.max(2, Math.min(98, Math.random() * 100));
    item.style.left = left + 'vw';

    // Random font size and duration
    const fontSize = (22 + Math.random() * 36);
    item.style.fontSize = fontSize + 'px';

    const duration = (4 + Math.random() * 5);
    item.style.animationDuration = duration + 's';

    if (item.textContent === '18') {
        item.style.fontWeight = '700';
        item.style.textShadow = '0 0 15px white';
    }

    // When animation ends, remove the node
    const removeFn = () => {
        item.removeEventListener('animationend', removeFn);
        if (item.parentNode) item.parentNode.removeChild(item);
    };
    item.addEventListener('animationend', removeFn);

    document.body.appendChild(item);
}

function startFalling() {
    if (fallingRunning) return; // prevent duplicates
    fallingRunning = true;
    lastSpawn = performance.now();

    const startTime = performance.now();

    function loop(now) {
        if (!fallingRunning) return;
        const elapsed = now - lastSpawn;
        if (elapsed >= spawnInterval) {
            spawnItem();
            lastSpawn = now;
        }
        // Stop after maxRunMs
        if (now - startTime >= maxRunMs) {
            stopFalling();
            return;
        }
        requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);

    // Safety: ensure we clear the running flag after maxRunMs
    if (spawnStopTimeout) clearTimeout(spawnStopTimeout);
    spawnStopTimeout = setTimeout(stopFalling, maxRunMs + 100);
}

function stopFalling() {
    fallingRunning = false;
    if (spawnStopTimeout) {
        clearTimeout(spawnStopTimeout);
        spawnStopTimeout = null;
    }
}

// Accessible keyboard: trigger openBirthday on Enter when button focused
openButton.addEventListener('keyup', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
        openBirthday();
    }
});

</script>

</body>
</html>
